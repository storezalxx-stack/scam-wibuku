<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Scam</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: white;

    background:
        radial-gradient(circle at 20% 10%, #8d2cff55, transparent 35%),
        radial-gradient(circle at 90% 30%, #5d00ff55, transparent 40%),
        linear-gradient(135deg, #160525, #27083e, #12021f);
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 25px 15px 50px;
}

/* JUDUL */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    color: #c68cff;
    font-size: 28px;
    text-shadow: 0 0 15px #a020ff;
}

.header p {
    margin-top: 7px;
    color: #a89aad;
    font-size: 13px;
}

/* DATA SCAM */

.scam-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.scam-card {
    padding: 18px;

    border: 1px solid #70219a66;
    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(76,17,108,.45),
            rgba(28,5,45,.85)
        );

    box-shadow: 0 10px 30px #0005;
}

/* FOTO */

.bukti-title {
    margin-bottom: 12px;

    color: #d28cff;
    font-size: 15px;
    font-weight: bold;
}

.bukti {
    width: 100%;
    max-height: 400px;

    display: block;

    object-fit: contain;

    border-radius: 14px;
    border: 1px solid #70219a88;

    background: #12051c;
}

/* INFO */

.info {
    margin-top: 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.info-left {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.label {
    color: #927ca0;
    font-size: 10px;
    letter-spacing: 1px;
}

.id {
    color: white;
    font-size: 17px;
    font-weight: bold;
}

/* JUMLAH SCAM */

.nominal {
    text-align: right;
}

.nominal .label {
    display: block;
}

.nominal b {
    color: #d28cff;
    font-size: 16px;
}

/* SALIN */

.copy-btn {
    width: 100%;
    margin-top: 15px;

    padding: 11px;

    border: 1px solid #8d2cff88;
    border-radius: 10px;

    color: white;
    background: linear-gradient(
        135deg,
        #8d2cff,
        #651bc9
    );

    font-weight: bold;
    cursor: pointer;

    transition: .2s;
}

.copy-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 15px #8d2cff66;
}

/* RESPONSIVE */

@media (max-width: 500px) {

    .info {
        align-items: flex-start;
    }

    .nominal {
        text-align: right;
    }

    .id {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>⚠️ DATA SCAM</h1>

        <p>
            Daftar ID yang dilaporkan
        </p>

    </div>


    <!-- DAFTAR SCAM -->

    <div class="scam-list">


        <!-- DATA 1 -->

        <div class="scam-card">

            <div class="bukti-title">
                📸 Bukti Scam
            </div>

            <img
                class="bukti"
                src="bukti1.jpg"
                alt="Bukti Scam"
            >

            <div class="info">

                <div class="info-left">

                    <span class="label">
                        ID SANG PENSCAM
                    </span>

                    <span class="id">
                        #*******
                    </span>

                </div>


                <div class="nominal">

                    <span class="label">
                        JUMLAH SCAM R.P
                    </span>

                    <b>
                        Rp 500.000
                    </b>

                </div>

            </div>


            <button
                class="copy-btn"
                onclick="copyID('#*******')"
            >
                📋 SALIN ID
            </button>

        </div>


        <!-- DATA 2 -->

        <div class="scam-card">

            <div class="bukti-title">
                📸 Bukti Scam
            </div>

                            📋 SALIN ID
            </button>

        </div>


    </div>

</div>


<script>

function copyID(id) {

    navigator.clipboard.writeText(id)
        .then(function() {

            alert(
                "ID " + id + " berhasil disalin!"
            );

        })
        .catch(function() {

            alert(
                "Gagal menyalin ID"
            );

        });

}

</script>

</body>
</html>
