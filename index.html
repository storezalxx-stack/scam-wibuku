<script>

/* DETEKSI DEVICE */
const ua = navigator.userAgent;

if (/Android/i.test(ua)) {
    document.getElementById("device").textContent = "Android";
} 
else if (/iPhone|iPad/i.test(ua)) {
    document.getElementById("device").textContent = "iPhone";
}
else {
    document.getElementById("device").textContent = "Desktop";
}


/* DETEKSI BROWSER */
if (ua.includes("Chrome")) {
    document.getElementById("browser").textContent = "Chrome";
}
else if (ua.includes("Firefox")) {
    document.getElementById("browser").textContent = "Firefox";
}
else if (ua.includes("Safari")) {
    document.getElementById("browser").textContent = "Safari";
}


/* BATERAI */
if (navigator.getBattery) {

    navigator.getBattery().then(function(battery) {

        function updateBattery() {

            let level = Math.round(battery.level * 100);

            document.getElementById("battery").textContent =
                level + "%";

            document.querySelector(".battery-bar").style.width =
                level + "%";
        }

        updateBattery();

        battery.addEventListener(
            "levelchange",
            updateBattery
        );

    });

}

</script>
