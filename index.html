<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading</title>

<link rel="icon" type="image/jpeg" href="SOL.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    background:#000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* =========================
   VIDEO
========================= */

#loading video{
    width:60%;
    max-width:350px;
    height:auto;
    max-height:70%;
    object-fit:contain;
}

/* =========================
   TULISAN
========================= */

.loading-text{
    margin-top:18px;

    color:white;
    font-size:15px;
    font-weight:bold;

    text-align:center;
}

/* =========================
   BULATAN LOADING
========================= */

.spinner{
    width:28px;
    height:28px;

    margin-top:12px;

    border:3px solid rgba(255,255,255,0.25);
    border-top:3px solid white;

    border-radius:50%;

    animation:spin 0.8s linear infinite;
}

/* ANIMASI */

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

</style>
</head>

<body>

<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loading">

    <!-- VIDEO -->
    <video id="loadingVideo"
           autoplay
           muted
           playsinline>

        <source src="lodingsol.mp4" type="video/mp4">

    </video>


    <!-- TULISAN -->
    <div class="loading-text">
        Tunggu sebentar...
    </div>


    <!-- BULATAN MUTER -->
    <div class="spinner"></div>

</div>


<script>

const video = document.getElementById("loadingVideo");

/* =========================
   VIDEO SELESAI
========================= */

video.addEventListener("ended", function(){

    window.location.href = "utama.html";

});

</script>

</body>
</html>
