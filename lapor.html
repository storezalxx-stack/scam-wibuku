<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapor Akun - SCAMER WBK</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    padding:20px;
    color:white;
    background:
        radial-gradient(circle at 20% 10%,#8d2cff55,transparent 35%),
        radial-gradient(circle at 90% 30%,#5d00ff55,transparent 40%),
        linear-gradient(135deg,#160525,#27083e,#12021f);
}

.box{
    width:100%;
    max-width:600px;
    margin:20px auto;
    padding:25px;
    border:1px solid #7623a866;
    border-radius:20px;
    background:#230736dd;
    box-shadow:0 10px 35px #0007;
}

h1{
    text-align:center;
    color:#c68cff;
    margin-bottom:8px;
}

.sub{
    text-align:center;
    color:#a89aad;
    font-size:13px;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#d8c8df;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #70219a;
    border-radius:10px;
    outline:none;
    color:white;
    background:#160522;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input[type="file"]{
    padding:10px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
    background:linear-gradient(135deg,#9a35ff,#651bc9);
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    display:none;
}

.back{
    display:block;
    margin-top:15px;
    text-align:center;
    color:#c68cff;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>⚠️ LAPOR AKUN</h1>

<p class="sub">
Kirim ID dan bukti laporan untuk diperiksa admin.
</p>

<form id="laporForm">

<label>ID Akun</label>

<input
    type="text"
    id="idAkun"
    placeholder="Masukkan ID akun"
    maxlength="30"
    required
>


<label>Kategori</label>

<select id="kategori" required>

<option value="">
-- Pilih kategori --
</option>

<option value="scam_bt">
SCAM BT
</option>

<option value="scam_buy_prem">
SCAM BUY PREM
</option>

</select>


<label>Foto Bukti</label>

<input
    type="file"
    id="foto"
    accept="image/*"
    required
>


<label>Keterangan</label>

<textarea
    id="keterangan"
    placeholder="Jelaskan laporan..."
    maxlength="1000"
    required
></textarea>


<button
    type="submit"
    id="submitBtn"
>
    📤 KIRIM LAPORAN
</button>

</form>

<div id="status"></div>

<a class="back" href="index.html">
← Kembali
</a>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyDVf9pB4lgU2L22o8HbsIPt1diZjJuNjiA",

    authDomain:
        "scamer-wibuku-85ec9.firebaseapp.com",

    projectId:
        "scamer-wibuku-85ec9",

    storageBucket:
        "scamer-wibuku-85ec9.firebasestorage.app",

    messagingSenderId:
        "476883765331",

    appId:
        "1:476883765331:web:a3e19520be1b2ddc4e9ea6"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const storage = firebase.storage();


const form =
    document.getElementById("laporForm");

const statusBox =
    document.getElementById("status");

const submitBtn =
    document.getElementById("submitBtn");


function status(text, success){

    statusBox.style.display = "block";

    statusBox.textContent = text;

    statusBox.style.background =
        success ? "#145c35" : "#6b1830";

}


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        submitBtn.disabled = true;

        submitBtn.textContent =
            "⏳ MENGIRIM...";


        try{

            const idAkun =
                document
                .getElementById("idAkun")
                .value
                .trim();

            const kategori =
                document
                .getElementById("kategori")
                .value;

            const keterangan =
                document
                .getElementById("keterangan")
                .value
                .trim();

            const file =
                document
                .getElementById("foto")
                .files[0];


            if(!file){

                throw new Error(
                    "Foto bukti wajib dipilih."
                );

            }


            if(file.size > 5 * 1024 * 1024){

                throw new Error(
                    "Ukuran foto maksimal 5 MB."
                );

            }


            const reportRef =
                db.collection("reports").doc();


            const storageRef =
                storage
                .ref()
                .child(
                    "reports/" +
                    reportRef.id +
                    "_" +
                    file.name
                );


            await storageRef.put(file);


            const fotoURL =
                await storageRef.getDownloadURL();


            await reportRef.set({

                idAkun: idAkun,

                kategoriPengirim:
                    kategori,

                kategoriAdmin:
                    null,

                keterangan:
                    keterangan,

                fotoURL:
                    fotoURL,

                status:
                    "pending",

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


            form.reset();


            status(
                "✅ Laporan berhasil dikirim dan menunggu pemeriksaan admin.",
                true
            );


        }catch(error){

            console.error(error);

            status(
                "❌ " + error.message,
                false
            );

        }


        submitBtn.disabled = false;

        submitBtn.textContent =
            "📤 KIRIM LAPORAN";

    }
);

</script>

</body>
</html>
